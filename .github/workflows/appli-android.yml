# Construction de l'appli Android (Play Store) à partir du site.
# Se lance après chaque mise en ligne du site, ou à la main (onglet Actions).
# Produit un fichier .aab NON signé, déposé sur la branche « appli-android ».
# La signature se fait hors de GitHub : la clé n'est jamais dans le dépôt.
name: Appli Android

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Mise en ligne"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: appli-android
  cancel-in-progress: true

jobs:
  construire:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Outil de génération
        run: npm install --no-save --prefix android @bubblewrap/core@1

      - name: Projet Android
        run: NODE_PATH=android/node_modules node android/generer.js build-android "${{ github.run_number }}"

      - name: Compilation (fichier .aab pour le Play Store)
        working-directory: build-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      - name: Dépôt sur la branche appli-android
        run: |
          mkdir -p /tmp/sortie
          cp build-android/app/build/outputs/bundle/release/*.aab /tmp/sortie/fil-rouge-apprenants-non-signe.aab
          cp build-android/twa-manifest.json /tmp/sortie/
          echo "Version ${{ github.run_number }} — construite le $(date -u +%Y-%m-%dT%H:%MZ) depuis ${GITHUB_SHA::8}" > /tmp/sortie/VERSION.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan appli-android
          git rm -rf . -q
          cp /tmp/sortie/* .
          git add -A
          git commit -q -m "Appli Android, version ${{ github.run_number }}"
          git push -f origin appli-android
