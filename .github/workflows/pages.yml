# Mise en ligne automatique du site (dossier « app ») sur GitHub Pages
# à chaque envoi sur la branche main. Aucune compilation.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Chaque mise en ligne porte un numéro de version unique : les navigateurs
      # rechargent aussitôt les fichiers modifiés au lieu de garder l'ancienne version.
      - name: Numéro de version des fichiers
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" app/*.html app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploiement
        uses: actions/deploy-pages@v4
