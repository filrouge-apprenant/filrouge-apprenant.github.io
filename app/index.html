<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- Toujours fond blanc, même si le téléphone impose le mode sombre aux sites. -->
  <meta name="color-scheme" content="only light">
  <!-- Sécurité : la page ne charge du code que depuis elle-même et la bibliothèque Supabase,
       et ne parle qu'au projet Supabase de Fil Rouge Apprenants. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://cafcevtehuywovvsllvp.supabase.co wss://cafcevtehuywovvsllvp.supabase.co; base-uri 'self'; form-action 'self'">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="referrer" content="no-referrer">
  <title>Fil Rouge Apprenants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="styles.css?v=__VERSION__">
  <script src="affichage.js?v=__VERSION__"></script>
</head>
<body>
  <header class="bandeau">
    <div class="bandeau-interieur">
      <button id="bouton-menu" class="bouton-menu" type="button" aria-controls="menu-lateral" aria-expanded="false" aria-label="Menu" hidden>
        <span class="bouton-menu-traits" aria-hidden="true"></span><span class="bouton-menu-texte">Menu</span>
      </button>
      <p class="marque">
        <span class="marque-texte">Fil Rouge <span class="marque-sous">Apprenants</span></span>
        <!-- Le fil rouge : un seul trait fin qui fait le tour du nom. -->
        <svg class="marque-fil" viewBox="0 0 320 64" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path d="M4 50 C 22 52, 30 44, 44 40 C 70 10, 170 2, 262 8 C 300 11, 316 24, 312 36 C 306 52, 250 60, 160 60 C 92 60, 30 57, 16 46 C 4 36, 10 16, 34 7"
                fill="none" stroke="#c1121f" stroke-width="1.4" stroke-linecap="round" vector-effect="non-scaling-stroke" pathLength="1"/>
        </svg>
      </p>
      <div id="zone-compte" class="zone-compte" hidden>
        <span id="compte-libelle" class="compte-libelle"></span>
        <button id="bouton-deconnexion" class="bouton-lien" type="button">Se déconnecter</button>
      </div>
    </div>
  </header>

  <div class="cadre">
    <nav id="menu-lateral" class="menu-lateral" aria-label="Navigation" hidden></nav>
    <main id="contenu" class="contenu" aria-live="polite">
      <p class="chargement">Chargement…</p>
    </main>
  </div>
  <div id="voile" class="voile" hidden></div>

  <footer class="pied">
    <p>Fil Rouge Apprenants · accompagnement anti-décrochage à distance · données hébergées en France</p>
    <p><button id="bouton-affichage" class="bouton-lien" type="button">Le fond s'affiche en noir ? Afficher en clair</button></p>
  </footer>

  <!-- Bibliothèque officielle Supabase, version figée. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=__VERSION__"></script>
  <script src="import.js?v=__VERSION__"></script>
  <script src="contact.js?v=__VERSION__"></script>
  <script src="app.js?v=__VERSION__"></script>
</body>
</html>
